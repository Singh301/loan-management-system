name: CI

on:
  push:
    branches: [ master, main, develop, production-grade-enhancements ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Unit tests and verification
        run: mvn -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/loan-management-system-*.jar
          retention-days: 14

      - name: Create source ZIP
        run: |
          zip -r loan-management-system-production-grade.zip . \
            -x '.git/*' 'target/*' 'logs/*' 'uploads/*'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: production-grade-source
          path: loan-management-system-production-grade.zip
          retention-days: 14
