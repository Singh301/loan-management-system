name: CI

on:
  push:
    branches: [ master, main, develop, production-grade-enhancements ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: loan_management_system
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://127.0.0.1:3306/loan_management_system?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: GitHubActionsOnlyJwtSecretForAutomatedTests12345678901234567890

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Tests and verification
        run: mvn -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/loan-management-system-*.jar
          retention-days: 14

      - name: Create source ZIP
        run: |
          zip -r loan-management-system-production-grade.zip . \
            -x '.git/*' 'target/*' 'logs/*' 'uploads/*'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: production-grade-source
          path: loan-management-system-production-grade.zip
          retention-days: 14
