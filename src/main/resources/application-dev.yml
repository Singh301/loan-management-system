# DEV ONLY — never use these defaults in production
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/loan_management_system
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Singh@301}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForLoanManagementSystemApplication2026SecureKey123456}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

file:
  upload-dir: uploads