# DEVELOPMENT ONLY. Production has no default credentials or secrets.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/loan_management_system}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Local-only default. Always override outside a developer workstation.
  secret: ${JWT_SECRET:LocalDevelopmentJwtSecretChangeMeBeforeDeployment1234567890}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

file:
  storage: local
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
