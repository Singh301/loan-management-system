spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Note: to enable Redis in prod, also set env
  # SPRING_AUTOCONFIGURE_EXCLUDE= (empty) or remove redis excludes from main yml when using Redis.

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

file:
  storage: ${FILE_STORAGE:s3}
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-south-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: loan-management-system

logging:
  level:
    root: INFO
    com.sudhanshu.loanmanagement: INFO
    org.hibernate.SQL: WARN
