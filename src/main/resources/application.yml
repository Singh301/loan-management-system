spring:
  application:
    name: loan-management-system

  cache:
    type: caffeine

  # Redis is optional. Exclude auto-config so local/dev works without Redis.
  # For prod multi-instance: set REDIS_HOST and remove these excludes via profile or env.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false

server:
  port: 8080

logging:

  file:
    name: logs/application.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId}] [%X{username}] [%X{method}] %X{api} %X{status} %X{executionTime} %X{ip} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId}] [%X{username}] [%X{method}] %X{api} %X{status} %X{executionTime} %X{ip} - %msg%n"

  level:
    root: INFO
    com.sudhanshu.loanmanagement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

springdoc:

  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
    disable-swagger-default-url: true

  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when_authorized

    prometheus:
      enabled: true

  info:
    env:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

info:

  application:
    name: Loan Management System
    description: Enterprise Loan Management System REST API
    version: 1.0.0
    developer: Sudhanshu Kumar Singh
    email: singh.kr1sudhanshu@gmail.com
    java: 21
    spring-boot: 3.5.4
    github: https://github.com/Singh301/loan-management-system

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
