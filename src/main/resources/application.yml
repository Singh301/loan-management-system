spring:
  application:
    name: loan-management-system
  cache:
    type: caffeine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId}] [%X{username}] [%X{method}] %X{api} %X{status} %X{executionTime} %X{ip} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId}] [%X{username}] [%X{method}] %X{api} %X{status} %X{executionTime} %X{ip} - %msg%n"
  level:
    root: INFO
    com.sudhanshu.loanmanagement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}

info:
  application:
    name: Loan Management System
    description: Production-oriented Loan Management System REST API
    version: 1.1.0
    java: 21
    spring-boot: 3.5.4
